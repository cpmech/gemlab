name: Ubuntu
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # russell_lab 4 links no external BLAS/LAPACK: the kernels are Rust, so the
      # only native library the build needs is SuiteSparse, for UMFPACK.
      - name: Install Libraries
        run: |
          sudo apt-get update -y && sudo apt-get install -y libsuitesparse-dev
      # cargo llvm-cov runs the tests itself, so this single instrumented run is
      # both the test gate and the coverage measurement -- there is no separate
      # `cargo test` step repeating the suite.
      - name: Coverage
        uses: cpmech/rust-cov@v1
        with:
          args: --workspace --features umfpack
          ignore-filename-regex: 'build.rs|src/bin/'
          min-lines: 90
          upload: true
